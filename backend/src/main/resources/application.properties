spring.application.name=aluguel
server.port=${SERVER_PORT:8080}

# Banco de dados: Supabase (PostgreSQL). Valores via variáveis de ambiente.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (HS256). JWT_SECRET deve ser Base64 de no mínimo 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Origens permitidas para o front-end (separadas por vírgula)
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# Senha inicial dos agentes pré-cadastrados (ver config/DataInitializer)
app.seed.agentes-senha=${AGENTES_SENHA_INICIAL}
